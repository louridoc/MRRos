name: ci

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Package tests (macOS)
        run: tools/ios-test.sh
      - name: Simulator build
        run: |
          brew install xcodegen
          tools/ios-build.sh | tee build.log
          grep -q "BUILD SUCCEEDED" build.log

  ros:
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy, lyrical]
    runs-on: ubuntu-24.04
    container: ros:${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v5
      - name: Python deps
        # A venv on top of the system packages: pip must not replace Ubuntu's own pytest/pluggy
        # (that fails on 24.04), and ROS's numpy stays the system one. Humble's numpy 1.21 needs
        # trimesh < 4.5 (newer trimesh breaks on it; same pin as the README).
        run: |
          apt-get update && apt-get install -y python3-pip python3-venv git netcat-openbsd
          python3 -m venv --system-site-packages /opt/ci
          trimesh=trimesh
          [ "${{ matrix.distro }}" = humble ] && trimesh="trimesh<4.5"
          /opt/ci/bin/pip install -q aiohttp pytest pytest-asyncio ruff "$trimesh"
      - name: Lint
        run: /opt/ci/bin/ruff check ros2_ws tools
      - name: Unit tests
        run: cd ros2_ws && /opt/ci/bin/python -m pytest -q
      - name: External sources for ${{ matrix.distro }}
        run: tools/fetch-external.sh ${{ matrix.distro }}
      - name: Build
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          cd ros2_ws
          PIP_BREAK_SYSTEM_PACKAGES=1 rosdep update && PIP_BREAK_SYSTEM_PACKAGES=1 rosdep install --from-paths src --ignore-src -y -r
          colcon build --packages-up-to ar_dev_bringup ar_bridge
      - name: Launch smoke test (every supported robot)
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          source ros2_ws/install/setup.bash
          for robot in crx30ia crx20ial ur30 ur20 ur10e; do
            echo "== $robot"
            ros2 launch ar_dev_bringup dev.launch.py robot:=$robot rviz:=false frozen:=true > launch_$robot.log 2>&1 &
            pid=$!
            ok=0
            for i in $(seq 1 30); do
              if nc -z localhost 9090 && ros2 topic list | grep -q '^/robot_description$'; then ok=1; break; fi
              sleep 1
            done
            kill $pid; wait $pid || true
            [ $ok = 1 ] || { tail -40 launch_$robot.log; exit 1; }
          done
