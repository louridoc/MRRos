name: MRRos
options:
  bundleIdPrefix: io.github.louridoc.mrros
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: XXXXXXXXXX   # Christian Lourido (Individual); override: DEVELOPMENT_TEAM=… xcodegen generate
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  ROSMessages:       { path: Packages/ROSMessages }
  ROSBridgeClient:   { path: Packages/ROSBridgeClient }
  TFKit:             { path: Packages/TFKit }
  URDFKit:           { path: Packages/URDFKit }
  ARBridgeTransport: { path: Packages/ARBridgeTransport }
  LiDARScan:         { path: Packages/LiDARScan }
  AlignmentKit:      { path: Packages/AlignmentKit }
  MeshProvider:      { path: Packages/MeshProvider }
  RobotModel:        { path: Packages/RobotModel }
  AppCore:           { path: Packages/AppCore }
  SceneLibrary:      { path: Packages/SceneLibrary }

targets:
  MRRos:
    type: application
    platform: iOS
    sources:
      - path: MRRos
        excludes: [Meshes]
      - path: MRRos/Meshes
        type: folder
        buildPhase: resources
    dependencies:
      - package: AppCore
      - package: ROSBridgeClient
      - package: ROSMessages
      - package: RobotModel
      - package: URDFKit
      - package: MeshProvider
      - package: SceneLibrary
      - package: ARBridgeTransport
    info:
      path: MRRos/Info.plist
      properties:
        CFBundleDisplayName: MRRos
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arkit, arm64]
        NSCameraUsageDescription: Camera is used for augmented reality and LiDAR scanning.
        NSLocalNetworkUsageDescription: Connects to the ROS 2 bridge on your local network.
        NSBonjourServices: [_rosbridge._tcp, _mrros._tcp]
        ITSAppUsesNonExemptEncryption: false
        # Saved scenes live in Documents/Scenes: visible in the Files app, AirDrop in/out (M5c).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.louridoc.mrros
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

schemes:
  MRRos:
    build:
      targets: { MRRos: all }
    run:
      config: Debug
    test:
      config: Debug
      targets: []
