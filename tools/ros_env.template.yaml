# RoboStack ROS 2 environment template. {{DISTRO}} ∈ humble | jazzy | lyrical.
# Rendered + created by: tools/ros-env.sh create <distro>
# Python version is left to the solver (3.10 on Humble, 3.12 on Jazzy/Lyrical).
name: ros_{{DISTRO}}
channels:
  - robostack-{{DISTRO}}
  - conda-forge
dependencies:
  - ros-{{DISTRO}}-desktop            # rclpy, rviz2, robot_state_publisher, tf2, common msgs
  - ros-{{DISTRO}}-rosbridge-suite
  - ros-{{DISTRO}}-ur-description
  - ros-{{DISTRO}}-joint-state-publisher
  - ros-{{DISTRO}}-joint-state-publisher-gui
  - ros-{{DISTRO}}-xacro
  - ros-{{DISTRO}}-sensor-msgs-py
  # M5: MoveIt (move_group, octomap perception, OMPL) + per-vendor configs. fanuc_moveit_config is
  # built from source (tools/external.repos.tsv) and needs moveit-ros-control-interface to build.
  - ros-{{DISTRO}}-moveit
  - ros-{{DISTRO}}-moveit-ros-perception    # octomap updaters — NOT pulled in by -moveit on RoboStack
  - ros-{{DISTRO}}-ur-moveit-config
  - ros-{{DISTRO}}-moveit-ros-control-interface
  - ros-{{DISTRO}}-moveit-simple-controller-manager
  - colcon-common-extensions
  - rosdep
  - compilers
  - cmake
  - pkg-config
  - make
  - ninja
  # ar_bridge runtime + mesh conversion + tests
  - numpy
  - trimesh
  - pycollada
  - aiohttp
  - pytest
  - pytest-asyncio
  - ruff
